version: '3.8'

services:
  api:
    build: 
      context: .
      dockerfile: src/Dockerfile
    command: uvicorn app.main:app --reload --workers 1 --host 0.0.0.0 --port 8000
    volumes:
      - ./src:/usr/src/app/src
      - ./pyproject.toml:/usr/src/app/pyproject.toml
    ports:
      - 8000:8000
    environment:
      - ENVIRONMENT=dev
      - TESTING=0
    env_file:
      - .env
    # Add healthcheck for better orchestration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  mongodb:
    image: mongo:latest
    container_name: knowledge_table_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      # Add any necessary MongoDB environment variables here (e.g., user/password)
      # MONGO_INITDB_ROOT_USERNAME: user
      # MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - knowledge-table-network

networks:
  knowledge-table-network:
    driver: bridge

volumes:
  milvus_data:
  mongo_data: